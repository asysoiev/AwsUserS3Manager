plugins {
    id 'java'
    id 'application'
}

group = 'com.sandbox'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'software.amazon.awssdk:s3:2.25.2'
    implementation 'software.amazon.awssdk:iam:2.25.2'
    implementation 'software.amazon.awssdk:sts:2.25.2'
}

application {
    mainClass = 'AwsUserS3Manager'
}